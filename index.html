<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="StudyLoop">
  <title>StudyLoop Pro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>

  <!-- ==================== 第1段階：単語帳一覧（ホーム） ==================== -->
  <div id="view-home" class="view-container">
    <header class="top-bar">
      <div class="brand-logo">StudyLoop</div>
      <div class="top-bar-actions">
        <button type="button" id="btn-home-bundle-url" class="btn-sub" title="全データを1つのURLで引越し">🔗 一括引越し</button>
        <label class="btn-icon file-label" title="JSON読込">
          📥
          <input type="file" id="home-import-json" accept=".json,application/json" hidden>
        </label>
        <button type="button" id="btn-theme" class="btn-icon" title="テーマ切替">🌙</button>
      </div>
    </header>

    <div id="home-share-box" class="share-box hidden"></div>

    <div class="home-intro">
      <h1 class="page-title">単語帳を選択</h1>
      <p class="page-sub">学習するデッキをタップしてください</p>
    </div>

    <div id="home-deck-list" class="deck-grid"></div>

    <div class="home-footer">
      <button type="button" id="btn-new-deck" class="btn-primary-large">＋ 新しい単語帳を作る</button>
    </div>
  </div>

  <!-- ==================== 第2段階：デッキ詳細・学習設定画面 ==================== -->
  <div id="view-deck" class="view-container hidden">
    <header class="deck-header">
      <button type="button" id="btn-back-home" class="btn-ghost">← 一覧</button>
      <div class="deck-title-area">
        <h2 id="current-deck-title" class="deck-title-text">デッキ名</h2>
      </div>
      <div class="deck-header-actions">
        <button type="button" id="btn-rename-deck" class="btn-icon" title="名前変更">✎</button>
        <button type="button" id="btn-delete-deck" class="btn-icon" title="削除">🗑</button>
      </div>
    </header>

    <nav class="tab-nav">
      <button type="button" class="tab-btn active" data-tab="setup">学習</button>
      <button type="button" class="tab-btn" data-tab="sheet">直前一覧</button>
      <button type="button" class="tab-btn" data-tab="stats">成績</button>
      <button type="button" class="tab-btn" data-tab="manage">追加・管理</button>
    </nav>

    <!-- タブ1: 学習設定 -->
    <main id="panel-setup" class="tab-panel active">
      <div class="hero-start-card">
        <button type="button" id="btn-start-study" class="btn-primary-large">
          学習を始める（<span id="start-target-count">0</span>問）
        </button>
      </div>

      <section class="setup-card">
        <div class="row-between" style="margin-bottom: 10px;">
          <h3 class="section-label" style="margin: 0;">単元・カテゴリ絞り込み</h3>
          <select id="category-filter" class="compact-select" aria-label="カテゴリ選択">
            <option value="ALL">すべての単元</option>
          </select>
        </div>
        <h3 class="section-label">進行ルール</h3>
        <div class="grid-2">
          <button type="button" class="choice-pill mode-btn active" data-mode="smart">標準（5問周期復習）</button>
          <button type="button" class="choice-pill mode-btn" data-mode="all">全問通して学習</button>
          <button type="button" class="choice-pill mode-btn" data-mode="weak">苦手・★特訓</button>
          <button type="button" class="choice-pill mode-btn" data-mode="srs">忘却曲線（SRS）</button>
        </div>
      </section>

      <section class="setup-card">
        <h3 class="section-label">出題形式</h3>
        <div class="grid-3">
          <button type="button" class="choice-pill format-btn active" data-format="flip">カードめくり</button>
          <button type="button" class="choice-pill format-btn" data-format="choice">ランダム4択</button>
          <button type="button" class="choice-pill format-btn" data-format="input">赤文字入力</button>
        </div>
      </section>

      <section class="setup-card">
        <h3 class="section-label">出題オプション</h3>
        <div class="grid-3">
          <button type="button" id="opt-reverse" class="toggle-pill">通常（Q→A）</button>
          <button type="button" id="opt-shuffle" class="toggle-pill">登録順</button>
          <button type="button" id="opt-redsheet" class="toggle-pill">赤シート: OFF</button>
        </div>
      </section>

      <section class="setup-card exam-row">
        <label for="exam-date" class="section-label">試験日</label>
        <div class="exam-controls">
          <input type="date" id="exam-date">
          <span id="exam-countdown" class="countdown-badge">未設定</span>
        </div>
      </section>

      <div class="start-actions">
        <button type="button" id="btn-reset-progress" class="btn-text-muted">このデッキの学習履歴をリセット</button>
      </div>
    </main>

    <!-- タブ2: 直前一覧シート -->
    <section id="panel-sheet" class="tab-panel">
      <div class="panel-toolbar no-print">
        <button type="button" id="sheet-redsheet-toggle" class="btn-sub">赤シート切替</button>
        <button type="button" id="btn-print-sheet" class="btn-sub">印刷 / PDF保存</button>
      </div>
      <div id="sheet-list" class="sheet-container"></div>
    </section>

    <!-- タブ3: 成績・分析 -->
    <section id="panel-stats" class="tab-panel">
      <div id="stats-container" class="stats-grid"></div>
      <div id="category-stats-container" class="setup-card"></div>
    </section>

    <!-- タブ4: 追加・管理 -->
    <section id="panel-manage" class="tab-panel">
      <div class="setup-card">
        <div class="row-between" style="margin-bottom: 8px;">
          <h3 class="section-label" style="margin: 0;">AIテキスト一括追加</h3>
          <button type="button" id="btn-copy-prompt" class="btn-sub">AI用指示文コピー</button>
        </div>
        <textarea id="import-text" rows="4" placeholder="カテゴリ | 問題文（表面） | 【重要語句や数式】を含む答え（裏面） | ヒント"></textarea>
        <button type="button" id="btn-import" class="btn-primary" style="width: 100%; margin-top: 8px;">一括インポート</button>
      </div>

      <div class="setup-card">
        <h3 class="section-label">1問ずつ追加（画像添付対応）</h3>
        <div class="form-stack">
          <input type="text" id="new-card-cat" placeholder="カテゴリ（例：1.トルコ人の移動）">
          <textarea id="new-card-front" rows="2" placeholder="表面（Q）の問題文・数式"></textarea>
          <textarea id="new-card-back" rows="2" placeholder="裏面（A）の答え（赤シートで隠す語句は【 】で囲む）"></textarea>
          <input type="text" id="new-card-hint" placeholder="ヒント（任意）">
          <div class="row-between">
            <label class="btn-sub file-label">
              画像を添付
              <input type="file" id="new-card-image" accept="image/*" hidden>
            </label>
            <span id="new-card-image-preview" class="muted-small">画像なし</span>
          </div>
          <button type="button" id="btn-add-single" class="btn-primary">このカードを追加</button>
        </div>
      </div>

      <div class="setup-card">
        <h3 class="section-label">CSV・バックアップファイル</h3>
        <div class="grid-2" style="margin-bottom: 8px;">
          <button type="button" id="btn-export-csv" class="btn-sub">CSV保存（Excel用）</button>
          <label class="btn-sub file-label">
            CSV読込（.csv）
            <input type="file" id="import-csv-file" accept=".csv,text/csv" hidden>
          </label>
        </div>
        <div class="grid-2">
          <button type="button" id="btn-export-json" class="btn-sub">JSON全保存</button>
          <label class="btn-sub file-label">
            JSON全読込
            <input type="file" id="import-json-file" accept=".json,application/json" hidden>
          </label>
        </div>
      </div>

      <div class="setup-card">
        <h3 class="section-label">URLで共有・一括引越し（自動圧縮対応）</h3>
        <div class="grid-2">
          <button type="button" id="btn-share-url" class="btn-sub">この単語帳を共有URL化</button>
          <button type="button" id="btn-bundle-url" class="btn-sub">全データ一括引越しURL</button>
        </div>
        <div id="share-output" class="share-box hidden"></div>
      </div>

      <div class="setup-card">
        <div class="row-between" style="margin-bottom: 8px;">
          <h3 class="section-label" style="margin: 0;">登録カード一覧</h3>
          <input type="search" id="manage-search" placeholder="検索..." style="max-width: 180px;">
        </div>
        <div id="manage-card-list" class="manage-list"></div>
      </div>
    </section>
  </div>

  <!-- ==================== 第3段階：学習集中画面（全画面） ==================== -->
  <div id="view-study" class="study-screen hidden">
    <header class="study-topbar">
      <button type="button" id="btn-exit-study" class="btn-ghost">← 戻る</button>
      <div class="progress-wrap">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="progress-meta">
          <span id="progress-text">1 / 1</span>
          <span id="study-phase-badge" class="phase-pill"></span>
        </div>
      </div>
      <div class="study-tools">
        <button type="button" id="btn-study-redsheet" class="btn-ghost" title="赤シート">赤</button>
        <button type="button" id="btn-undo" class="btn-ghost" title="1つ戻る">↩</button>
      </div>
    </header>

    <!-- 復習モード突入オーバーレイ -->
    <div id="review-interstitial" class="interstitial-overlay hidden">
      <div class="interstitial-box">
        <div class="interstitial-title">復習タイム</div>
        <div id="review-count-label" class="interstitial-sub">間違えた 5問 を復習します</div>
        <button type="button" id="btn-start-review" class="btn-primary-large">復習を始める</button>
      </div>
    </div>

    <!-- 完了画面オーバーレイ -->
    <div id="complete-interstitial" class="interstitial-overlay hidden">
      <div class="interstitial-box">
        <div class="interstitial-title">学習完了！</div>
        <div id="complete-summary" class="interstitial-sub"></div>
        <div class="interstitial-actions">
          <button type="button" id="btn-restart-session" class="btn-primary">もう一度</button>
          <button type="button" id="btn-complete-home" class="btn-sub">デッキへ戻る</button>
        </div>
      </div>
    </div>

    <!-- 中央フラッシュカード（3Dフリップ対応） -->
    <main class="study-main">
      <div id="card-stage" class="flashcard-wrapper">
        <div id="swipe-badge-left" class="swipe-indicator left">×</div>
        <div id="swipe-badge-right" class="swipe-indicator right">◯</div>
        <button type="button" id="btn-pin" class="pin-btn" aria-label="ピン留め">☆</button>

        <div id="card-flipper" class="flashcard-inner">
          <!-- 表面 -->
          <div id="card-front" class="card-face card-front">
            <span id="front-badge" class="side-badge">Q</span>
            <div class="card-scroll-body">
              <img id="front-image" class="card-img hidden" alt="">
              <div id="front-content" class="card-text"></div>
            </div>
            <div class="card-footer-slot">
              <button type="button" id="btn-hint" class="hint-btn hidden">💡 ヒント</button>
              <div id="hint-text" class="hint-box hidden"></div>
              <span class="tap-guide">タップで裏返す</span>
            </div>
          </div>

          <!-- 裏面 -->
          <div id="card-back" class="card-face card-back">
            <span id="back-badge" class="side-badge back">A</span>
            <div class="card-scroll-body">
              <img id="back-image" class="card-img hidden" alt="">
              <div id="back-content" class="card-text"></div>
            </div>
            <div class="card-footer-slot">
              <span class="tap-guide">左右スワイプ または 下のボタンで判定</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 下部操作エリア -->
    <footer class="study-bottom">
      <div id="flip-controls" class="judge-row">
        <button type="button" id="btn-wrong" class="judge-btn wrong">×</button>
        <button type="button" id="btn-correct" class="judge-btn correct">◯</button>
      </div>

      <div id="choice-container" class="choice-grid hidden"></div>

      <div id="input-container" class="input-area hidden">
        <div class="input-row">
          <input type="text" id="answer-input" placeholder="答えを入力..." autocomplete="off">
          <button type="button" id="btn-submit-answer" class="btn-primary">判定</button>
        </div>
        <div id="input-feedback" class="input-feedback hidden"></div>
        <button type="button" id="btn-input-next" class="btn-primary hidden">次へ</button>
      </div>
    </footer>
  </div>

  <!-- ==================== カード編集モーダル ==================== -->
  <div id="edit-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3 class="section-label" style="font-size: 1rem; color: var(--text);">カードを編集</h3>
      <div class="form-stack">
        <input type="text" id="edit-card-cat" placeholder="カテゴリ">
        <textarea id="edit-card-front" rows="3" placeholder="表面（Q）"></textarea>
        <textarea id="edit-card-back" rows="3" placeholder="裏面（A）"></textarea>
        <input type="text" id="edit-card-hint" placeholder="ヒント（任意）">
      </div>
      <div class="interstitial-actions" style="margin-top: 14px;">
        <button type="button" id="btn-edit-cancel" class="btn-sub">キャンセル</button>
        <button type="button" id="btn-edit-save" class="btn-primary">保存する</button>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
